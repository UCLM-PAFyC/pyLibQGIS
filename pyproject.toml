[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pylib-qgis"
version = "0.1.0"
description = "..."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "DHL" }
]

dependencies = [
    "pylib-crss",
    "pylib-gdal",
    "pylib-qttools",
    "pylib-project",
]

[project.optional-dependencies]
numpy = [
    "numpy",
]
qgis = [
    "qgis"
]
osgeo = [
    "ogr",
    "gdal",
    "osr",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]